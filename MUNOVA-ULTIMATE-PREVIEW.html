<script>
/* MUNOVA Windows microphone permission + reliable country flag rendering. */
(function(){
  const style = document.createElement('style');
  style.id = 'munova-flag-mic-patch-style';
  style.textContent = `
    .munova-flag-img{display:inline-block;width:24px;height:17px;object-fit:cover;vertical-align:-3px;border-radius:2px;box-shadow:0 0 0 1px #14283a18;margin-inline:2px;flex:0 0 auto}
    .bigflag .munova-flag-img,.activityflag .munova-flag-img{width:30px;height:21px;vertical-align:middle;margin:0}
    .mini-delegate .munova-flag-img{width:19px;height:14px}
    .countrychip .munova-flag-img{width:20px;height:14px}
    .munova-mic-status{display:flex;align-items:center;gap:7px;margin-top:8px;padding:8px 10px;border-radius:9px;background:#f3f8fb;color:#64788a;font-size:11px;line-height:1.5}
    .munova-mic-status::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:#a8b7c4;flex:0 0 auto}
    .munova-mic-status[data-state="ready"]{background:#eefaf5;color:#176e5a}.munova-mic-status[data-state="ready"]::before{background:#27a77e}
    .munova-mic-status[data-state="recording"]{background:#fff0f0;color:#a13b43}.munova-mic-status[data-state="recording"]::before{background:#d74f58;box-shadow:0 0 0 4px #d74f5818}
    .munova-mic-status[data-state="error"]{background:#fff6e9;color:#895a1b}.munova-mic-status[data-state="error"]::before{background:#d59a32}
    select.munova-flag-select{background-repeat:no-repeat!important;background-position:10px center!important;background-size:24px 16px!important;padding-left:42px!important}
    .munova-country-picker{position:relative;width:100%;min-width:0;z-index:2}
    .munova-country-trigger{width:100%;min-height:39px;display:flex;align-items:center;gap:9px;text-align:left;border:1px solid #dfe7ed;border-radius:9px;padding:9px 11px;background:#fff;color:#22374b;font-size:12px}
    .munova-country-trigger:focus{outline:2px solid #80cfc1;outline-offset:1px}
    .munova-country-selected-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
    .munova-country-chevron{margin-left:auto;color:#71869a;font-size:17px}
    .munova-picker-symbol{width:24px;min-width:24px;text-align:center;font-size:19px;line-height:1}
    .munova-country-menu{position:absolute;top:calc(100% + 5px);left:0;right:0;z-index:10020;background:#fff;border:1px solid #dce6ed;border-radius:12px;box-shadow:0 16px 45px #1024382b;padding:8px}
    .munova-country-menu[hidden]{display:none!important}
    .munova-country-search{width:100%;border:1px solid #dfe7ed;border-radius:9px;padding:10px 11px;font-size:12px;outline:none;margin-bottom:7px}
    .munova-country-search:focus{border-color:#65bfae;box-shadow:0 0 0 3px #168d8012}
    .munova-country-options{max-height:min(300px,48vh);overflow:auto;overscroll-behavior:contain;display:grid;gap:2px}
    .munova-country-option{display:flex;align-items:center;gap:10px;width:100%;border:0;background:#fff;color:#24394c;border-radius:8px;text-align:left;padding:8px;font-size:12px;min-height:34px}
    .munova-country-option:hover,.munova-country-option:focus{background:#eef8f7;outline:none}
    .munova-country-option[aria-selected="true"]{background:#e8f7f3;color:#126d61;font-weight:700}
    .munova-country-tick{margin-left:auto;color:#168d80;font-weight:800}
    .munova-country-empty{padding:18px 10px;text-align:center;color:#728093;font-size:12px}
    select.munova-native-country-select{position:absolute!important;left:-10000px!important;top:auto!important;width:1px!important;height:1px!important;opacity:0!important;pointer-events:none!important;padding:0!important;margin:0!important}
    @media(max-width:780px){.munova-flag-img{width:22px;height:16px}.bigflag .munova-flag-img{width:28px;height:20px}.munova-mic-status{font-size:12px}}
  `;
  document.head.appendChild(style);

  function flagCodeFromEmoji(flag){
    const chars=Array.from(String(flag||''));
    if(chars.length<2)return '';
    const cps=chars.map(c=>c.codePointAt(0));
    if(cps.length!==2||cps.some(cp=>cp<0x1F1E6||cp>0x1F1FF))return '';
    return cps.map(cp=>String.fromCharCode(cp-0x1F1E6+65)).join('').toLowerCase();
  }
  function flagEmojiFromText(s){return String(s||'').match(/[\u{1F1E6}-\u{1F1FF}]{2}/u)?.[0]||''}
  function flagCodeForName(name){
    const clean=String(name||'').trim();
    if(typeof countries!=='undefined'){
      const item=countries.find(c=>String(c[0]).toLowerCase()===clean.toLowerCase());
      if(item)return flagCodeFromEmoji(item[1]);
    }
    if(typeof flagFor==='function')return flagCodeFromEmoji(flagFor(clean));
    return '';
  }
  function makeFlagImg(emoji){
    const code=flagCodeFromEmoji(emoji);if(!code)return null;
    const item=typeof countries!=='undefined'?countries.find(c=>c[1]===emoji):null;
    const img=document.createElement('img');
    img.className='munova-flag-img';img.loading='lazy';img.decoding='async';
    img.alt=item?`${item[0]}: bandera`:'Bandera';img.title=item?item[0]:'';
    img.src=`https://flagcdn.com/w40/${code}.png`;
    img.addEventListener('error',function(){const t=document.createTextNode(emoji);this.replaceWith(t)},{once:true});
    return img;
  }
  function decorateFlagText(root){
    if(!root)return;
    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
    const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
    const rx=/[\u{1F1E6}-\u{1F1FF}]{2}/gu;
    for(const node of nodes){
      const parent=node.parentElement;if(!parent)continue;
      if(/^(SCRIPT|STYLE|TEXTAREA|INPUT|OPTION|SELECT|NOSCRIPT)$/.test(parent.tagName)||parent.closest('script,style,textarea,input,option,select,noscript'))continue;
      const text=node.nodeValue||'';rx.lastIndex=0;if(!rx.test(text))continue;rx.lastIndex=0;
      const frag=document.createDocumentFragment();let last=0,m;
      while((m=rx.exec(text))){if(m.index>last)frag.appendChild(document.createTextNode(text.slice(last,m.index)));const img=makeFlagImg(m[0]);if(img)frag.appendChild(img);else frag.appendChild(document.createTextNode(m[0]));last=m.index+m[0].length;}
      if(last<text.length)frag.appendChild(document.createTextNode(text.slice(last)));
      node.replaceWith(frag);
    }
  }
  function pickerFlagForName(name){
    const known=typeof countries!=='undefined'?countries.find(c=>c[0]===name):null;
    if(known)return known[1];
    const actor=typeof S!=='undefined'?(S.actors||[]).find(a=>a.name===name):null;
    if(actor&&actor.icon)return actor.icon;
    const delegate=typeof S!=='undefined'?(S.delegations||[]).find(d=>d.country===name):null;
    return delegate?.flag||'';
  }
  function buildPickerFlag(name){
    const emoji=pickerFlagForName(name);const img=makeFlagImg(emoji);
    if(img)return img;
    const span=document.createElement('span');span.className='munova-picker-symbol';span.textContent=emoji||'◈';return span;
  }
  function decorateCountrySelects(root){
    if(!root)return;
    const selects=root.querySelectorAll?root.querySelectorAll('select'):[];
    selects.forEach(sel=>{
      const likelyCountry=sel.options.length>=200 || sel.matches('select[name="country"]')&&Array.from(sel.options).some(o=>flagCodeForName(o.value));
      if(!likelyCountry)return;
      let picker=sel.__munovaCountryPicker;
      if(!picker){
        const wrapper=document.createElement('div');wrapper.className='munova-country-picker';
        const trigger=document.createElement('button');trigger.type='button';trigger.className='munova-country-trigger';trigger.setAttribute('aria-haspopup','listbox');trigger.setAttribute('aria-expanded','false');
        const menu=document.createElement('div');menu.className='munova-country-menu';menu.hidden=true;
        const search=document.createElement('input');search.type='search';search.className='munova-country-search';search.placeholder='Buscar país, organización o personaje…';search.setAttribute('aria-label','Buscar país, organización o personaje por nombre');
        const optionsBox=document.createElement('div');optionsBox.className='munova-country-options';optionsBox.setAttribute('role','listbox');
        menu.append(search,optionsBox);wrapper.append(trigger,menu);
        sel.parentElement.insertBefore(wrapper,sel);
        sel.classList.add('munova-native-country-select');sel.setAttribute('aria-hidden','true');sel.tabIndex=-1;
        picker={wrapper,trigger,menu,search,optionsBox};sel.__munovaCountryPicker=picker;
        function close(){wrapper.classList.remove('is-open');menu.hidden=true;trigger.setAttribute('aria-expanded','false');}
        function choose(value){sel.value=value;sel.dispatchEvent(new Event('change',{bubbles:true}));close();trigger.focus();}
        function renderOptions(query=''){
          const q=query.trim().toLocaleLowerCase('es');optionsBox.replaceChildren();
          const list=Array.from(sel.options).filter(o=>!o.disabled&&(`${o.value} ${o.textContent}`).toLocaleLowerCase('es').includes(q));
          if(!list.length){const empty=document.createElement('div');empty.className='munova-country-empty';empty.textContent='No encontré coincidencias. Revisa la escritura.';optionsBox.appendChild(empty);return;}
          const frag=document.createDocumentFragment();
          list.forEach(opt=>{
            const row=document.createElement('button');row.type='button';row.className='munova-country-option';row.setAttribute('role','option');row.setAttribute('aria-selected',String(opt.value===sel.value));
            row.appendChild(buildPickerFlag(opt.value));const name=document.createElement('span');name.textContent=opt.value||opt.textContent.replace(/^\s*\S+\s/u,'');row.appendChild(name);
            if(opt.value===sel.value){const tick=document.createElement('span');tick.className='munova-country-tick';tick.textContent='✓';row.appendChild(tick);}
            row.addEventListener('click',()=>choose(opt.value));frag.appendChild(row);
          });optionsBox.appendChild(frag);
        }
        function open(){wrapper.classList.add('is-open');menu.hidden=false;trigger.setAttribute('aria-expanded','true');search.value='';renderOptions('');search.focus();}
        trigger.addEventListener('click',()=>wrapper.classList.contains('is-open')?close():open());
        search.addEventListener('input',()=>renderOptions(search.value));
        search.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();close();trigger.focus();}else if(e.key==='Enter'){e.preventDefault();optionsBox.querySelector('.munova-country-option')?.click();}});
        sel.addEventListener('change',()=>refreshPicker(sel));
        picker.close=close;picker.renderOptions=renderOptions;
      }
      refreshPicker(sel);
    });
  }
  function refreshPicker(sel){
    const picker=sel?.__munovaCountryPicker;if(!picker)return;
    const value=sel.value||'';picker.trigger.replaceChildren();picker.trigger.appendChild(buildPickerFlag(value));
    const label=document.createElement('span');label.className='munova-country-selected-name';label.textContent=value||'Seleccionar país';picker.trigger.appendChild(label);
    const chevron=document.createElement('span');chevron.className='munova-country-chevron';chevron.textContent='⌄';picker.trigger.appendChild(chevron);
    picker.trigger.title=`Representación seleccionada: ${value}`;
    if(picker.wrapper.classList.contains('is-open'))picker.renderOptions(picker.search.value);
  }
  function setMicStatus(message,state='ready'){
    const el=document.getElementById('munovaMicStatus');if(!el)return;
    el.textContent=message;el.dataset.state=state;
  }
  function mountMicStatus(root=document){
    const btn=root.querySelector?.('#micButton');if(!btn)return;
    btn.title='Pulsa para solicitar permiso de micrófono e iniciar/detener el dictado';
    btn.setAttribute('aria-label','Solicitar permiso e iniciar dictado por micrófono');
    const field=btn.closest('.field');if(!field)return;
    let status=field.querySelector('#munovaMicStatus');
    if(!status){status=document.createElement('div');status.id='munovaMicStatus';status.className='munova-mic-status';status.dataset.state='ready';status.setAttribute('role','status');status.setAttribute('aria-live','polite');status.textContent='Listo para dictar. Pulsa el micrófono y permite el acceso cuando Chrome o Edge lo solicite.';btn.closest('.actionrow')?.insertAdjacentElement('afterend',status);}
    const help=field.querySelector('.help');if(help)help.textContent='En Windows, abre MUNOVA en Chrome o Edge. Pulsa 🎙 y acepta el permiso del navegador; el dictado funciona en HTTPS (Vercel) o localhost. No se puede pedir permiso automáticamente sin una acción tuya.';
  }
  function decorateApp(root=document.getElementById('app')){decorateFlagText(root);decorateCountrySelects(root);mountMicStatus(root);}

  /* A microphone prompt must be initiated by a click. Once allowed, start browser dictation. */
  let permissionCheckedThisPage=false;
  startMic=async function(){
    const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(micActive){
      try{micRecognition?.stop();}catch{}
      micActive=false;
      document.getElementById('micButton')?.classList.remove('recording');
      setMicStatus('Dictado detenido. El texto se conserva en la intervención.','ready');
      toast('Dictado detenido.');return;
    }
    if(!Speech){
      setMicStatus('Este navegador no admite dictado Web Speech. Usa la versión actual de Google Chrome o Microsoft Edge.','error');
      toast('Dictado no compatible. Prueba Chrome o Edge actualizado.');return;
    }
    if(!window.isSecureContext && location.hostname!=='localhost' && location.hostname!=='127.0.0.1'){
      setMicStatus('El micrófono necesita una página HTTPS. Publica MUNOVA en Vercel o abre localhost.','error');
      toast('Para activar el micrófono, usa HTTPS o localhost.');return;
    }
    if(!navigator.mediaDevices?.getUserMedia){
      setMicStatus('El navegador no expone el permiso de micrófono. Abre MUNOVA en Chrome o Edge mediante HTTPS.','error');
      toast('No se pudo solicitar el permiso de micrófono.');return;
    }
    const button=document.getElementById('micButton');
    const ta=document.getElementById('liveText');
    if(!ta){toast('Abre Mesa en vivo antes de iniciar el dictado.');return;}
    setMicStatus(permissionCheckedThisPage?'Iniciando el dictado…':'Solicitando permiso de micrófono… acepta “Permitir” en la ventana del navegador.','');
    if(button)button.disabled=true;
    if(!permissionCheckedThisPage){
      try{
        /* This permission request is deliberately made only after the user presses the microphone button. */
        const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
        stream.getTracks().forEach(track=>track.stop());
        permissionCheckedThisPage=true;
      }catch(err){
        const denied=err?.name==='NotAllowedError'||err?.name==='PermissionDeniedError';
        const message=denied?'Permiso denegado. En la barra de direcciones, pulsa el candado → Permisos del sitio → Micrófono → Permitir y vuelve a intentarlo.':err?.name==='NotFoundError'?'No se encontró un micrófono. Conecta uno o habilita el micrófono integrado de Windows.':'No se pudo acceder al micrófono. Revisa los permisos de Windows y del navegador.';
        setMicStatus(message,'error');toast(message);if(button)button.disabled=false;return;
      }
    }
    try{
      micRecognition=new Speech();
      micRecognition.lang=S.settings.language==='English'?'en-US':S.settings.language==='Français'?'fr-FR':'es-CO';
      micRecognition.continuous=true;micRecognition.interimResults=true;micRecognition.maxAlternatives=1;
      const initial=(ta.value||S.drafts.liveText||'').trimEnd();let finalText='';
      micRecognition.onstart=()=>{micActive=true;if(button){button.disabled=false;button.classList.add('recording');}setMicStatus('Micrófono activo. Habla con naturalidad; pulsa de nuevo para detener y conservar el texto.','recording');toast('Micrófono activo.');};
      micRecognition.onresult=e=>{
        let interim='';
        for(let i=e.resultIndex;i<e.results.length;i++){
          const transcript=e.results[i][0]?.transcript||'';
          if(e.results[i].isFinal)finalText+=(finalText?' ':'')+transcript.trim();else interim+=(interim?' ':'')+transcript.trim();
        }
        const pieces=[initial,finalText.trim(),interim.trim()].filter(Boolean);
        ta.value=pieces.join(initial&&finalText?' ':' ');
        const wc=document.getElementById('wordCount');if(wc)wc.textContent=`${ta.value.trim()?ta.value.trim().split(/\s+/).length:0} palabras`;
        S.drafts.liveText=ta.value;
      };
      micRecognition.onerror=e=>{
        const messages={ 'not-allowed':'El navegador bloqueó el micrófono. Permítelo desde el candado de la barra de direcciones.', 'service-not-allowed':'El servicio de dictado está bloqueado por el navegador o la organización.', 'audio-capture':'No se pudo capturar el audio. Comprueba qué micrófono usa Windows.', 'network':'El dictado del navegador necesita conexión a internet.', 'no-speech':'No detecté voz. Acércate al micrófono y vuelve a intentarlo.', 'aborted':'El dictado se interrumpió.'};
        const msg=messages[e.error]||`Error de dictado: ${e.error||'desconocido'}`;
        setMicStatus(msg,e.error==='no-speech'?'ready':'error');
        if(e.error!=='no-speech'&&e.error!=='aborted')toast(msg);
      };
      micRecognition.onend=()=>{
        micActive=false;button?.classList.remove('recording');if(button)button.disabled=false;
        const current=document.getElementById('liveText');if(current){S.drafts.liveText=current.value;save();}
        setMicStatus('Dictado detenido. Texto conservado; revisa nombres propios y cifras antes de guardar.','ready');
      };
      micActive=true;
      micRecognition.start();
      /* If start() throws synchronously, the catch below reports it. */
    }catch(err){
      micActive=false;if(button){button.disabled=false;button.classList.remove('recording');}
      const msg=err?.name==='InvalidStateError'?'El dictado ya estaba iniciado. Pulsa el micrófono para detenerlo.':'No se pudo iniciar el dictado. Revisa permisos y prueba Chrome o Edge actualizado.';
      setMicStatus(msg,'error');toast(msg);
    }
  };

  const originalRender=render;
  render=function(){originalRender();decorateApp(document.getElementById('app'));};
  document.addEventListener('click',function(event){
    document.querySelectorAll('.munova-country-picker.is-open').forEach(wrapper=>{if(!wrapper.contains(event.target)){wrapper.classList.remove('is-open');const menu=wrapper.querySelector('.munova-country-menu');const trigger=wrapper.querySelector('.munova-country-trigger');if(menu)menu.hidden=true;if(trigger)trigger.setAttribute('aria-expanded','false');}});
  });
  const app=document.getElementById('app');
  if(app&&'MutationObserver'in window){
    const observer=new MutationObserver(records=>{
      for(const record of records){for(const node of record.addedNodes){if(node.nodeType===1)decorateApp(node);else if(node.nodeType===3)decorateFlagText(node.parentElement);}}
    });
    observer.observe(app,{childList:true,subtree:true});
  }
  decorateApp(document.getElementById('app'));
  document.addEventListener('change',function(event){
    if(event.target?.tagName==='SELECT'){
      decorateCountrySelects(document.getElementById('app'));
      if(event.target.__munovaCountryPicker)refreshPicker(event.target);
    }
  },true);
  /* Re-render once so the active-country controls and flag images are initialized. */
  render();
})();

</script>
