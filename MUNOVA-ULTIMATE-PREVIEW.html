/* MUNOVA identity refresh: bright, calm, UN-inspired, responsive */
:root{--navy:#0b2e55;--navy2:#0b4c7c;--navy3:#126a96;--ink:#12345a;--muted:#6e829b;--line:#e1edf6;--paper:#f2f8fd;--white:#fff;--teal:#078cc7;--teal2:#e2f6fd;--gold:#c7a243;--blue:#168ff0;--red:#e45863;--shadow:0 7px 24px rgba(18,61,99,.075);--radius:16px}

.',''+S.delegations.length+' REGISTROS')}<div class="delegationlist">${S.delegations.map(d=>`<div class="delegationrow"><div class="bigflag">${d.flag||flagFor(d.country)}</div><div><h3>${esc(d.delegate||'Delegado/a sin nombre')}</h3><p><b>${esc(d.country)}</b> · ${esc(d.bloc||'Afinidad no registrada')}<br>${esc((d.position||'Postura pendiente').slice(0,120))}</p><div class="actionrow" style="margin-top:8px"><button class="btn small" data-action="set-country" data-value="${escAttr(d.country)}">Activar en mesa</button><select class="pillselect" data-attendance="${escAttr(d.id)}">${['Presente','Presente y vota','Tarde','Ausente','Pendiente'].map(a=>`<option ${d.attendance===a?'selected':''}>${a}</option>`).join('')}</select></div></div><button class="btn small danger" data-action="delete-delegate" data-id="${d.id}" title="Eliminar delegado">✕</button></div>`).join('')}</div></div></div>`}
function renderRecentInterventions(limit=8){const list=(S.interventions||[]).slice().reverse().slice(0,limit);if(!list.length)return '<div class="empty"><b>Aún no hay intervenciones.</b>Registra la primera intervención para construir la bitácora del comité.</div>';return list.map(i=>`<article class="intervention"><div class="interventiontop"><b>${esc(flagFor(i.country))} ${esc(i.country)} · ${esc(i.type||'Intervención')}</b><small>${esc(i.time||'')}</small></div><p>${esc(i.text||'')}</p><div class="chips">${(i.keywords||[]).map(k=>`<span class="chip">${esc(k)}</span>`).join('')}</div></article>`).join('')}

utton('go-speech','Preparar réplica')}</div><div id="liveAnalysis" style="margin-top:13px">${S.drafts.lastAnalysis?`<div class="resultbox">${esc(S.drafts.lastAnalysis).replace(/\n/g,'<br>')}</div>`:''}<div id="liveAIResult">${S.drafts.lastAI_analyze?markdownToHtml(S.drafts.lastAI_analyze):''}</div></div></div><div class="panel panelpad">${panelHead('Bitácora de debate','Cada registro queda vinculado al país y a la sesión activa.',''+S.interventions.length+' INTERVENCIONES')}<div class="searchbar" style="margin-bottom:13px"><input id="interventionSearch" placeholder="Buscar país, palabra o afirmación…"><button class="btn" data-action="export-interventions">Exportar bitácora</button></div><div id="liveInterventions">${renderRecentInterventions(8)}</div></div></div><div class="panel panelpad" style="margin-top:16px">${panelHead('Preguntas que nacieron del debate','El asistente las crea al registrar intervenciones. Prioriza las que requieren evidencia antes de negociar.','INVESTIGACIÓN')}${renderResearchQueue(4)}</div>`}
function keywords(text){const stop=new Set('para desde entre como pero porque donde cuando sobre este esta estos estas unos unas una uno con sin por del las los que sus más muy todo toda cada puede deben debe haber sido será han hay ante hacia contra mediante mientras otros otra mismo misma según este esta'.split(' '));const words=(text.toLowerCase().match(/[a-záéíóúñü]{4,}/g)||[]).filter(w=>!stop.has(w));const freq={};words.forEach(w=>freq[w]=(freq[w]||0)+1);return Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>x[0])}
function followups(text){const t=text.toLowerCase(),q=[];if(/\d|por ciento|%|millones|mil millones|aumentó|disminuyó|según/.test(t))q.push('¿Cuál es la fuente primaria, el año, la unidad y la metodología de la cifra citada?');if(/debe|oblig|exige|derecho|tratado|artículo|resolución/.test(t))q.push('¿Qué tratado, artículo o resolución establece la obligación y a quién aplica?');if(/financ|presupuesto|recursos|fondo|costo/.test(t))q.push('¿Qué entidad financiaría la propuesta, con qué instrumento y bajo qué controles?');if(/programa|crear|establecer|mecanismo|implementar|propuesta/.test(t))q.push('¿Quién implementaría la medida, en qué plazo y con qué indicadores verificables?');if(/soberanía|jurisdicción|competencia|mandato/.test(t))q.push('¿La medida está dentro del mandato de este comité y respeta las competencias de los órganos involucrados?');if(/país|estado|delegación|gobierno/.test(t))q.push('¿La postura atribuida al Estado está respaldada por una declaración oficial o documento primario?');q.push('¿Qué dato o evidencia independiente permitiría medir el resultado y revisar la medida si no funciona?');return [...new Set(q)].slice(0,5)}
function analyzeText(text,country='País por identificar'){const ks=keywords(text),qs=followups(text);const sentences=text.split(/(?<=[.!?])\s+/).filter(s=>s.trim().length>20);const claims=sentences.filter(s=>/\d|según|demuestra|aument|disminu|causa|provoca|obliga|establece|resolución|tratado|artículo|por ciento|%/i.test(s));return {keywords:ks,questions:qs,claims,summary:`INTERVENCIÓN DE ${country.toUpperCase()}\n\nIdea central probable: ${sentences[0]||text.slice(0,240)}\n\nAfirmaciones que requieren comprobación: ${claims.length?claims.map(x=>'• '+x).join('\n'):'• No se detectaron cifras o referencias normativas explícitas; verificar la tesis central.'}\n\nPalabras clave: ${ks.join(', ')||'No detectadas'}\n\nSiguiente paso: contrastar las afirmaciones con fuentes oficiales, anotar fecha y página y distinguir hecho verificado de hipótesis.`}}
function renderResearchQueue(limit=8){const list=S.research.filter(r=>r.status!=='Resuelta').slice(0,limit);if(!list.length)return '<div class="empty"><b>Sin tareas abiertas.</b>Registra una intervención o crea una pregunta de investigación.</div>';return list.map(r=>`<div class="evidencerow"><div class="interventiontop"><b>${esc(r.title||'Pregunta de investigación')}</b><select class="pillselect" data-research-status="${r.id}">${['Pendiente','En curso','Resuelta'].map(a=>`<option ${r.status===a?'selected':''}>${a}</option>`).join('')}</select></div><p>${esc(r.question)}</p>${r.source?`<a href="${escAttr(r.source)}" target="_blank" rel="noreferrer">Fuente registrada ↗</a>`:''}<div class="actionrow" style="margin-top:8px"><button class="btn small" data-action="research-query" data-id="${r.id}">Buscar en web</button><button class="btn small" data-action="add-evidence-from-task" data-id="${r.id}">Añadir evidencia</button></div></div>`).join('')}
function renderStrategy(){const active=currentDelegates()[0];const allText=S.interventions.map(i=>`${i.country}: ${i.text}`).join('\n');return `${pageHead('INTELIGENCIA DIPLOMÁTICA','Sala de estrategia','Prepara objetivos, alianzas posibles y preguntas tácticas usando posturas registradas y debate observado. No atribuye posiciones oficiales sin fuente.',button('ai-strategy','Generar estrategia con IA + web','primary'))}<div class="grid two"><div class="panel panelpad">${panelHead('Ficha de estrategia','La IA recibirá estos campos junto con el comité, las delegaciones y las intervenciones.','OBJETIVOS')}<div class="formgrid"><div class="field full"><label>OBJETIVO PRINCIPAL</label><textarea data-bind="drafts.strategyGoal" placeholder="Qué quieres lograr en la resolución">${esc(S.drafts.strategyGoal||'Conseguir una cláusula de implementación medible y con financiación identificable.')}</textarea></div><div class="field"><label>INTERÉS PRIORITARIO</label><input data-bind="drafts.strategyInterest" value="${escAttr(S.drafts.strategyInterest||'Protección de civiles y acceso humanitario')}"></div><div class="field"><label>LÍNEA ROJA</label><input data-bind="drafts.strategyRedLine" value="${escAttr(S.drafts.strategyRedLine||'No afirmar obligaciones sin fuente primaria')}"></div><div class="field full"><label>CONCESIÓN NEGOCIABLE</label><textarea data-bind="drafts.strategyConcession">${esc(S.drafts.strategyConcession||'Negociar calendario, forma de reporte y alcance piloto, manteniendo salvaguardas esenciales.')}</textarea></div></div><div class="divider"></div>${button('ai-strategy','Analizar escenario y proponer táctica','primary')} ${button('strategy-local','Análisis rápido local')}</div><div class="panel panelpad">${panelHead('Mapa de actores','Posturas tal como fueron registradas; no son un análisis oficial.',''+uniqueCountries().length+' PAÍSES')}<div class="delegationlist">${uniqueCountries().map(d=>`<div class="delegationrow"><div class="bigflag">${d.flag||flagFor(d.country)}</div><div><h3>${esc(d.country)}</h3><p>${esc(d.position||'Postura pendiente de verificar')}<br><b>${esc(d.bloc||'Afinidad sin registrar')}</b></p></div><span class="tag ${d.attendance==='Presente'?'green':'gold'}">${esc(d.attendance)}</span></div>`).join('')}</div><div class="divider"></div><div class="notice">No conviertas una afinidad probable en postura atribuida. Verifica declaraciones nacionales, votos y documentos oficiales.</div></div></div><div class="panel panelpad" style="margin-top:16px">${panelHead('Resultado estratégico','Incluye hechos verificados, hipótesis etiquetadas, preguntas y siguientes pasos.','ASISTENTE')}<div id="strategyResult" class="resultbox">${S.drafts.lastAI_strategy?markdownToHtml(S.drafts.lastAI_strategy):S.drafts.lastStrategyLocal?markdownToHtml(S.drafts.lastStrategyLocal):'Pulsa “Generar estrategia con IA + web” para activar el asistente conectado al servidor (requiere API configurada), o usa el análisis local para una primera estructura.'}</div></div>`}
function renderResolution(){const d=S.drafts;return `${pageHead('DISEÑO DE POLÍTICAS','Laboratorio resolutivo','Pasa de una intervención o problema a una propuesta viable: evidencia, población afectada, responsable, recursos, indicadores, salvaguardas y fuente. La IA conectada puede investigar en la web y devolver citas.',button('ai-resolution','Investigar + diseñar solución','primary'))}<div class="grid two"><div class="panel panelpad">${panelHead('Diseñador de soluciones','Rellena lo conocido. Si falta evidencia, el asistente debe marcarlo como pendiente, no inventarlo.','MÉTODO')}<div class="formgrid"><div class="field full"><label>TÍTULO DE LA PROPUESTA</label><input data-bind="drafts.resTitle" value="${escAttr(d.resTitle)}"></div><div class="field full"><label>PROBLEMA CONCRETO</label><textarea data-bind="drafts.resProblem" placeholder="Qué ocurre, dónde, a quién afecta y por qué importa">${esc(d.resProblem||S.settings.agenda)}</textarea></div><div class="field full"><label>EVIDENCIA / DATO Y FUENTE (SI YA TIENES)</label><textarea data-bind="drafts.resEvidence" placeholder="Dato, año, organismo, URL o referencia del handbook">${esc(d.resEvidence)}</textarea></div><div class="field"><label>POBLACIÓN AFECTADA</label><input data-bind="drafts.resBeneficiaries" value="${escAttr(d.resBeneficiaries)}" placeholder="Población o región afectada"></div><div class="field"><label>RESPONSABLE / COMPETENCIA</label><input data-bind="drafts.resImplementer" value="${escAttr(d.resImplementer)}" placeholder="Órgano o actor competente"></div><div class="field full"><label>MECANISMO PROPUESTO</label><textarea data-bind="drafts.resMechanism" placeholder="Acción concreta, pasos, coordinación">${esc(d.resMechanism)}</textarea></div><div class="field"><label>FINANCIACIÓN</label><input data-bind="drafts.resFunding" value="${escAttr(d.resFunding)}" placeholder="Fuente realista / por verificar"></div><div class="field"><label>PLAZO</label><input data-bind="drafts.resDeadline" value="${escAttr(d.resDeadline)}"></div><div class="field full"><label>INDICADORES DE RESULTADO</label><textarea data-bind="drafts.resIndicators" placeholder="Indicador, línea base, meta, frecuencia y fuente">${esc(d.resIndicators)}</textarea></div><div class="field full"><label>SALVAGUARDAS / RIESGOS</label><textarea data-bind="drafts.resSafeguards" placeholder="Derechos, privacidad, soberanía, auditoría, participación">${esc(d.resSafeguards)}</textarea></div></div><div class="divider"></div><div class="actionrow">${button('ai-resolution','Investigar con web + diseñar','primary')}${button('local-resolution','Crear borrador estructurado')}</div><p class="footnote">Las cláusulas y el mandato cambian según el órgano y el reglamento de la conferencia. La IA debe distinguir datos encontrados, inferencias y vacíos de evidencia.</p></div><div class="panel panelpad">${panelHead('Datos reales y fuentes','Busca en portales oficiales y guarda el dato con su URL antes de incorporarlo a la propuesta.','EVIDENCIA')}<div class="field"><label>CONSULTA DE INVESTIGACIÓN</label><input id="evidenceQuery" value="${escAttr(S.settings.agenda)}" placeholder="Tema + país + año + indicador"></div><div class="actionrow" style="margin-top:10px">${button('search-web-evidence','Buscar en web oficial','primary')}${button('add-evidence','Registrar evidencia')}</div><div class="sourcechips" style="margin-top:12px"><a target="_blank" rel="noreferrer" href="https://documents.un.org/">Documentos ONU ↗</a><a target="_blank" rel="noreferrer" href="https://data.un.org/">Datos ONU ↗</a><a target="_blank" rel="noreferrer" href="https://data.worldbank.org/">Banco Mundial ↗</a><a target="_blank" rel="noreferrer" href="https://treaties.un.org/">Tratados ONU ↗</a></div><div class="divider"></div><div id="evidenceList">${renderEvidenceList()}</div><div class="notice" style="margin-top:13px">En modo local, MUNOVA no puede verificar una cifra que no haya consultado. En Vercel, al configurar el asistente web, pedirá fuentes actuales y mostrará referencias citadas. Revisa que cada enlace abra y que la cifra corresponda al año, población y unidad correctos.</div></div></div><div class="panel panelpad" style="margin-top:16px">${panelHead('Borrador de resolución','Puedes incorporar cláusulas y después generar un documento formal.','SALIDA')}<div id="resolutionResult" class="resultbox">${S.drafts.lastAI_resolution?markdownToHtml(S.drafts.lastAI_resolution):S.drafts.lastResolution?esc(S.drafts.lastResolution).replace(/\n/g,'<br>'):'Aún no hay borrador. Completa los campos y pulsa “Crear borrador estructurado” o “Investigar + diseñar solución”.'}</div><div class="actionrow" style="margin-top:12px">${button('use-resolution-doc','Pasar a documentos')}${button('download-resolution','Descargar borrador','teal')}</div></div>`}
function renderResearch(){const h=S.handbook;return `${pageHead('CENTRO DE EVIDENCIA','Handbook inteligente','Sube el handbook, extrae el texto, busca una palabra o una norma y salta al fragmento exacto. El PDF se muestra dentro de esta misma pantalla.',button('open-pdf-url','Abrir PDF por URL'))}<div class="panel panelpad" style="margin-bottom:15px">${panelHead('Cargar documento','PDF con texto, DOCX, TXT, MD o CSV. Los PDF escaneados necesitan OCR antes de poder buscar texto.','EXTRACCIÓN')}<div class="grid two"><div><label class="btn primary" for="handbookFile">＋ Subir handbook / norma / tratado</label><input id="handbookFile" type="file" accept=".pdf,.docx,.txt,.md,.csv,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain" class="hidden"><p class="help" style="margin-top:9px">La extracción ocurre en el navegador. No sube el documento a ningún servidor en modo local.</p></div><div>${h.name?`<div class="successnotice"><b>Documento cargado:</b> ${esc(h.name)}<br>${h.pages.length} fragmentos/páginas indexados · ${h.text.length.toLocaleString('es-CO')} caracteres.<br><button class="btn small" data-action="clear-handbook" style="margin-top:9px">Quitar documento</button></div>`:'<div class="notice">Aún no hay handbook. Carga el PDF y espera a que termine la extracción; si el documento está escaneado, usa OCR o pega el texto extraído.</div>'}</div></div></div><details style="margin-top:13px"><summary style="font-size:11px;font-weight:800;color:#536b7e;cursor:pointer">¿No se extrajo el texto? Pegar texto manualmente / corregir extracción</summary><div class="field" style="margin-top:12px"><label>TEXTO EXTRAÍDO DEL HANDBOOK</label><textarea id="manualHandbookText" style="min-height:150px" placeholder="Pega aquí el texto copiado del PDF, el reglamento o el documento…"></textarea><div class="actionrow"><button class="btn" data-action="index-pasted-handbook">Indexar texto pegado</button></div></div></details><div class="handbooklayout"><div class="panel panelpad">${panelHead('Buscar en todo el documento','Escribe una frase, artículo, término o varias palabras clave.','BÚSQUEDA')}<div class="searchbar"><input id="handbookSearch" placeholder="Ej. artículo 27, financiación, punto de orden…"><button class="btn primary" data-action="search-handbook">Buscar</button></div><div class="actionrow" style="margin-top:10px">${button('handbook-summary','Extraer puntos clave')}${button('handbook-questions','Crear preguntas de investigación')}</div><div class="divider"></div><div id="handbookResults">${S.drafts.lastSearchQuery?handbookResultsMarkup(S.drafts.lastSearchQuery):'<div class="empty"><b>El buscador está listo.</b>Cuando cargues un documento, aparecerán los números de página y fragmentos coincidentes.</div>'}</div><div id="handbookSummary">${S.drafts.lastAI_research?markdownToHtml(S.drafts.lastAI_research):S.drafts.handbookSummary?esc(S.drafts.handbookSummary).replace(/\n/g,'<br>'):''}</div></div><div class="viewer"><div class="viewerhead"><b id="viewerTitle">${esc(S.viewer.title||'Visor de documentos')}</b><div class="actionrow">${button('viewer-open-new','Abrir pestaña','small')}${button('viewer-close','Cerrar','small')}</div></div>${S.viewer.url?`<iframe id="documentFrame" src="${escAttr(S.viewer.url)}${S.handbook.type==='pdf'&&S.viewer.url===pdfBlobUrl?'#page='+(S.viewer.page||1)+'&zoom=page-width':S.viewer.page&&S.viewer.url.toLowerCase().includes('.pdf')?'#page='+S.viewer.page+'&zoom=page-width':''}" title="Visor de documento" allow="fullscreen"></iframe>`:h.name&&h.pages.length?`<div class="viewerplaceholder" style="display:block;text-align:left;overflow:auto"><b>Fragmento ${S.viewer.page||1} · ${esc(h.name)}</b><pre style="font:12px/1.7 'DM Sans',sans-serif;white-space:pre-wrap;text-align:left;color:#344b60">${esc(h.pages[(S.viewer.page||1)-1]||h.text.slice(0,5000))}</pre></div>`:'<div class="viewerplaceholder"><div><div style="font-size:35px;margin-bottom:12px">▤</div><b>Visor integrado</b><br>Al cargar un PDF o abrir una fuente, se mostrará aquí.<br>El buscador indicará la página y el fragmento que debes revisar.</div></div>'}</div></div><div class="panel panelpad" style="margin-top:15px">${panelHead('Preguntas de investigación generadas','A partir del tema y de los puntos clave extraídos.','COLA')}<div class="actionrow" style="margin-bottom:12px">${button('ai-research','Investigar en web + citar fuentes','primary')}${button('go-resolution','Usar en laboratorio resolutivo')}</div>${renderResearchQueue(12)}</div>`}
function renderEvidenceList(){if(!S.evidence.length)return '<div class="empty">Aún no has guardado evidencia. Busca un dato en una fuente oficial, registra la URL y la fecha y aparecerá aquí.</div>';return S.evidence.slice().reverse().map(e=>`<div class="evidencerow"><div class="interventiontop"><b>${esc(e.title)}</b><span class="tag ${e.verified?'green':'gold'}">${e.verified?'VERIFICADA POR USUARIO':'POR CONTRASTAR'}</span></div><p>${esc(e.fact)}</p><small>${esc(e.date||'Fecha no indicada')} · ${esc(e.publisher||'Organismo no indicado')}</small><br><a target="_blank" rel="noreferrer" href="${escAttr(e.url)}">${esc(e.url)} ↗</a><div class="actionrow" style="margin-top:9px"><button class="btn small" data-action="use-evidence" data-id="${e.id}">Añadir a solución</button><button class="btn small" data-action="delete-evidence" data-id="${e.id}">Eliminar</button></div></div>`).join('')}
function renderLanguage(){return `${pageHead('ORATORIA E INFLUENCIA','Lenguaje diplomático en tiempo real','No memorices frases sin contexto. Construye una intervención con postura, evidencia, mecanismo y pregunta; adapta el tono a apertura, réplica, negociación o moción.',button('go-live','Volver al debate','primary'))}<div class="grid two"><div class="panel panelpad">${panelHead('Constructor de intervención','Completa los cuatro bloques y genera una intervención oral de 30–90 segundos.','SPEECH LAB')}<div class="formgrid"><div class="field full"><label>POSICIÓN DE TU DELEGACIÓN</label><textarea data-bind="drafts.speechPosition" placeholder="Qué defiende tu delegación">${esc(S.drafts.speechPosition||S.delegations.find(d=>d.country===S.settings.activeCountry)?.position||'')}</textarea></div><div class="field full"><label>EVIDENCIA / FUENTE</label><textarea data-bind="drafts.speechEvidence" placeholder="Dato verificado, año, fuente y enlace">${esc(S.drafts.speechEvidence||S.evidence.slice(-1)[0]?.fact||'')}</textarea></div><div class="field full"><label>PROPUESTA / MECANISMO</label><textarea data-bind="drafts.speechMechanism" placeholder="Qué propones y cómo funcionaría">${esc(S.drafts.speechMechanism||S.drafts.resMechanism||'')}</textarea></div><div class="field full"><label>PREGUNTA O LLAMADO FINAL</label><input data-bind="drafts.speechAsk" value="${escAttr(S.drafts.speechAsk||'¿Qué mecanismo verificable permitiría medir el cumplimiento?')}"></div></div><div class="divider"></div><div class="actionrow">${button('build-speech','Construir discurso','primary')}${button('ai-speech','Mejorar con IA')}${button('copy-speech','Copiar texto')}</div><div class="footnote">Fórmula: tesis clara → evidencia con fuente → mecanismo viable → pregunta o invitación. Para no inventar hechos, el generador utiliza solo los datos que hayas aportado.</div></div><div class="panel panelpad">${panelHead('Frases tácticas listas para copiar','Haz clic en copiar y adáptala al contexto.','LENGUAJE')}<div class="phrasegrid">${Object.entries(phraseGroups).map(([group,phrases])=>`<div class="phrasecard"><h3>${group}</h3>${phrases.map(p=>`<div class="phrase"><span>${esc(p.replaceAll('{PAIS}',S.settings.activeCountry))}</span><button data-action="copy" data-text="${escAttr(p.replaceAll('{PAIS}',S.settings.activeCountry))}">Copiar</button></div>`).join('')}</div>`).join('')}</div></div></div><div class="panel panelpad" style="margin-top:15px">${panelHead('Verbos resolutivos y alcance','La elección del verbo define el tipo de acción y puede cambiar el efecto político o jurídico.','PRECISIÓN')}<div class="grid three">${verbs.map(v=>`<div class="evidencerow"><b>${esc(v[0])}</b><p>${esc(v[1])}</p><button class="btn small" data-action="insert-verb" data-value="${escAttr(v[0])}">Usar en cláusula</button></div>`).join('')}</div><div class="notice">Confirma siempre el reglamento de procedimiento y el mandato del comité. Una resolución MUN académica no se convierte automáticamente en norma vinculante.</div></div><div class="panel panelpad" style="margin-top:15px">${panelHead('Resultado de oratoria','Edítalo, cópialo o pásalo a un documento formal.','BORRADOR')}<div id="speechResult" class="resultbox">${S.drafts.lastAI_speech?markdownToHtml(S.drafts.lastAI_speech):S.drafts.lastSpeech?esc(S.drafts.lastSpeech).replace(/\n/g,'<br>'):'Pulsa “Construir discurso” para crear tu intervención.'}</div><div class="actionrow" style="margin-top:10px">${button('speech-to-doc','Crear documento con este discurso')}${button('speech-timer','Cronometrar 60 segundos')}</div></div>`}
function renderDocuments(){return `${pageHead('PRODUCCIÓN DIPLOMÁTICA','Documentos listos para usar','Genera documentos con bandera, país, comité, sesión, título y formato Times New Roman. Descarga un archivo compatible con Word o imprime a PDF.',button('doc-template-position','Documento de posición','primary')+button('doc-template-press','Comunicado de prensa'))}<div class="grid two"><div class="panel panelpad">${panelHead('Generador de documentos','Completa los metadatos y edita el contenido.','EXPORTACIÓN')}<div class="formgrid"><div class="field"><label>TIPO</label><select data-bind="drafts.docType"><option value="position" ${S.drafts.docType==='position'?'selected':''}>Documento de posición</option><option value="speech" ${S.drafts.docType==='speech'?'selected':''}>Discurso</option><option value="resolution" ${S.drafts.docType==='resolution'?'selected':''}>Proyecto de resolución</option><option value="press" ${S.drafts.docType==='press'?'selected':''}>Comunicado de prensa</option><option value="briefing" ${S.drafts.docType==='briefing'?'selected':''}>Briefing estratégico</option><option value="minutes" ${S.drafts.docType==='minutes'?'selected':''}>Acta de sesión</option><option value="project" ${S.drafts.docType==='project'?'selected':''}>Propuesta de proyecto</option></select></div><div class="field"><label>TÍTULO</label><input data-bind="drafts.docTitle" value="${escAttr(S.drafts.docTitle)}"></div><div class="field full"><label>CONTENIDO</label><textarea class="tall" data-bind="drafts.docBody" placeholder="Escribe o genera el contenido. Puedes usar saltos de línea.">${esc(S.drafts.docBody||'')}</textarea></div></div><div class="actionrow" style="margin-top:12px">${button('doc-template','Insertar estructura del tipo seleccionado')}${button('ai-document','Generar contenido con IA + fuentes','teal')}${button('generate-doc-preview','Actualizar vista previa','primary')}${button('download-doc','Descargar Word (.doc)')}${button('print-doc','Imprimir / guardar PDF')}</div><div id="docAIStatus" style="margin-top:10px">${S.drafts.lastAI_document?markdownToHtml(S.drafts.lastAI_document):''}</div><div class="footnote">La exportación .doc es HTML compatible con Word/LibreOffice, no un paquete OOXML .docx nativo. Puedes abrirlo y guardarlo como .docx desde Word.</div></div><div class="panel panelpad">${panelHead('Vista previa editorial','Bandera, encabezado diplomático y tipografía serif formal.','TIMES NEW ROMAN')}<div id="docPreview" class="docpreview">${documentHtml(S.drafts.docTitle,S.drafts.docBody)}</div></div></div><div class="panel panelpad" style="margin-top:15px">${panelHead('Documentos generados','Los borradores guardados se mantienen en este navegador.','ARCHIVO')}<div class="delegationlist">${S.documents.slice().reverse().map(d=>`<div class="delegationrow"><div class="bigflag">${flagFor(d.country)}</div><div><h3>${esc(d.title)}</h3><p>${esc(d.type)} · ${esc(d.country)} · ${esc(d.date)}<br>${esc(d.preview||'')}</p><div class="actionrow" style="margin-top:7px"><button class="btn small" data-action="load-doc" data-id="${d.id}">Abrir borrador</button><button class="btn small" data-action="download-saved-doc" data-id="${d.id}">Descargar</button></div></div><button class="btn small danger" data-action="delete-doc" data-id="${d.id}">✕</button></div>`).join('')||'<div class="empty">Aún no has guardado documentos. Genera una vista previa y pulsa descargar para archivarlo.</div>'}</div></div>`}
function richTextHTML(text){return String(text||'').split('\n').map(line=>{const trimmed=line.trim();if(!trimmed)return '<p class="spacer">&nbsp;</p>';if(/^###\s/.test(trimmed))return `<h3>${esc(trimmed.replace(/^###\s/,''))}</h3>`;if(/^##\s/.test(trimmed))return `<h2>${esc(trimmed.replace(/^##\s/,''))}</h2>`;if(/^#\s/.test(trimmed))return `<h2>${esc(trimmed.replace(/^#\s/,''))}</h2>`;let safe=esc(trimmed);safe=safe.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noreferrer">$1</a>');if(/^[-•]\s/.test(trimmed))return `<p class="docbullet">• ${safe.replace(/^[-•]\s/,'')}</p>`;if(/^\d+[.)]\s/.test(trimmed))return `<p class="docclause">${safe}</p>`;return `<p>${safe}</p>`}).join('')}
function documentHtml(title,body){return `<div class="docheader"><div class="flag">${flagFor(S.settings.activeCountry)}</div><b>NACIONES UNIDAS · SIMULACIÓN ACADÉMICA</b><br><span>${esc(S.settings.conference)}</span></div><div class="docmeta"><b>${esc(S.settings.committee)}</b><br>${esc(S.settings.session)} · ${esc(S.settings.sessionDate)}<br>Delegación de ${esc(S.settings.activeCountry)}</div><div class="doctitle">${esc(title||'DOCUMENTO DIPLOMÁTICO')}</div><div class="docbody">${richTextHTML(body||'Escribe o genera el contenido del documento.')}</div><div class="docfoot">Documento preparado para simulación académica MUNOVA. Verifica las citas, las normas, los datos y el mandato del comité antes de su presentación.</div>`}

><small>${esc(f.type.toUpperCase())} · ${formatBytes(f.size)} · ${esc(f.addedAt||'')} · ${Number(f.chars||0).toLocaleString('es-CO')} caracteres indexados</small><div class="actionrow"><button class="btn small primary" data-action="open-research-file" data-id="${escAttr(f.id)}">Abrir / ver</button><button class="btn small" data-action="download-research-file" data-id="${escAttr(f.id)}">Descargar original</button><button class="btn small danger" data-action="delete-research-file" data-id="${escAttr(f.id)}">Eliminar</button></div></div></article>`).join(''):'<div class="empty">Todavía no has añadido archivos.</div>'}</div></div></div><div class="panel panelpad" style="margin-top:16px"><div class="panelhead"><div><h2>Visor de investigación</h2><p>Abre un PDF o una fuente compatible sin salir de MUNOVA. Algunos sitios externos bloquean el visor; usa “Nueva pestaña” si ocurre.</p></div><span class="tag">VISOR</span></div><div class="viewer"><div class="viewerhead"><b>${esc(S.viewer.title||'Visor del comité')}</b><div class="actionrow">${button('viewer-open-new','Abrir pestaña','small')}${button('viewer-close','Cerrar','small')}</div></div>${S.viewer.url?`<iframe id="documentFrame" src="${escAttr(S.viewer.url)}${S.viewer.page&&S.viewer.url.toLowerCase().includes('.pdf')?'#page='+S.viewer.page+'&zoom=page-width':''}" title="Visor de investigación" allow="fullscreen"></iframe>`:'<div class="viewerplaceholder"><div><b>Visor listo.</b><br>Abre un PDF, una URL directa o selecciona una fuente de tu archivo.</div></div>'}</div></div>`}
function formatBytes(n){if(!Number.isFinite(Number(n)))return 'tamaño desconocido';const b=Number(n);return b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(2)+' MB'}
function renderView(){switch(S.view){case 'dashboard':return renderDashboard();case 'delegations':return renderDelegations();case 'actors':return renderActors();case 'live':return renderLive();case 'motions':return renderMotions();case 'strategy':return renderStrategy();case 'resolution':return renderResolution();case 'documents':return renderDocuments();case 'research':return renderResearch();case 'investigation':return renderInvestigation();case 'language':return renderLanguage();case 'resources':return renderResources();case 'settings':return renderSettings();default:S.view='dashboard';return renderDashboard()}}
function render(){const activeCountry=uniqueCountries().find(d=>d.country===S.settings.activeCountry);document.getElementById('app').innerHTML=`<div class="shell"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brandmark">◎</div><div><div class="brandname">MUN<span>OVA</span></div><div class="brandsub">MODEL UNITED NATIONS</div></div></div><div class="navlabel">WORKSPACE</div><div class="nav">${nav.map(n=>`<button data-action="navigate" data-view="${n[0]}" class="${S.view===n[0]?'active':''}"><span style="width:19px;text-align:center;font-size:16px">${n[1]}</span><span>${n[2]}</span>${n[0]==='research'&&S.research.filter(r=>r.status!=='Resuelta').length?`<span class="count">${S.research.filter(r=>r.status!=='Resuelta').length}</span>`:''}</button>`).join('')}</div><div class="sidebottom"><div class="autosave"><span class="dot"></span><span id="saveStatus">Autoguardado local activo</span></div><div class="sidehelp" data-action="navigate" data-view="settings">⚙ Ajustes, datos y privacidad ↗</div><div class="footnote" style="color:#728ba0;margin-top:15px">MUNOVA · WORKSPACE 2.0<br>Herramienta académica independiente</div></div></aside><main class="main"><header class="topbar"><button class="btn mobilemenu" data-action="toggle-menu">☰</button><div class="global-search"><span style="font-size:19px">⌕</span><input id="globalSearch" placeholder="Buscar países, temas, tratados, resoluciones…" autocomplete="off"><button data-action="global-search">Buscar</button></div><div class="topright"><select class="topselect" data-bind="settings.activeCountry" aria-label="País activo">${countrySelectOptions(S.settings.activeCountry)}</select><span class="statuspill">${window.MunovaCloud?.isConnected?.()?'● NUBE':'● LOCAL'}</span></div></header><div class="content">${renderView()}</div></main></div>`;wireLiveText();}
function setView(view){S.view=view;save();render();document.getElementById('sidebar')?.classList.remove('open');window.scrollTo({top:0,behavior:'smooth'})}
function setCountry(country){S.settings.activeCountry=country;S.settings.activeDelegate=currentDelegates()[0]?.id||'';save();render();toast(`${flagFor(country)} ${country} activo en la mesa.`)}
function addCountryQuick(country){country=String(country||'').trim();if(!country){toast('Elige o escribe un país.');return}const known=countries.find(c=>c[0].toLowerCase()===country.toLowerCase());if(known)country=known[0];let existing=S.delegations.find(d=>d.country.toLowerCase()===country.toLowerCase());if(existing){S.settings.activeCountry=existing.country;S.settings.activeDelegate=existing.id;save();render();toast(`${existing.flag||flagFor(existing.country)} ${existing.country} ya estaba en el comité y quedó activo.`);return}const item={id:makeId(),country,flag:flagFor(country),delegate:`Delegación de ${country}`,position:'Pendiente de verificar en fuentes oficiales.',bloc:'Por confirmar',attendance:'Pendiente',redLines:'',notes:''};S.delegations.push(item);S.settings.activeCountry=country;S.settings.activeDelegate=item.id;save();render();toast(`${item.flag} ${country} añadido. Ya aparece en la mesa en vivo.`)}

function addResearch(title,question,origin='Intervención'){S.research.push({id:makeId(),title,question,priority:S.research.filter(r=>r.status!=='Resuelta').length<2?'Alta':'Media',status:'Pendiente',source:'',createdAt:now(),origin});}
function saveIntervention(text,type){if(!text.trim()){toast('Escribe o dicta una intervención antes de guardar.');return}const actor=(S.actors||[]).find(x=>x.id===S.settings.activeActorId);const country=actor?actor.name:(S.settings.activeCountry||'País por identificar');const d=currentDelegates().find(x=>x.id===S.settings.activeDelegate)||currentDelegates()[0];const a=analyzeText(text,country);const it={id:makeId(),country,speaker:actor?`${actor.name} · ${actor.type}`:(d?.delegate||`Delegación de ${country}`),actorId:actor?.id||'',type,text:text.trim(),time:now(),keywords:a.keywords,status:'Analizada'};S.interventions.push(it);a.questions.slice(0,4).forEach((q,i)=>addResearch(`Verificar intervención: ${a.keywords.slice(0,2).join(' ')||country}`,q,`Intervención de ${country}`));S.drafts.liveText='';S.drafts.lastAnalysis=a.summary;save();render();const box=document.getElementById('liveAnalysis');if(box)box.innerHTML=`<div class="successnotice"><b>Intervención guardada.</b> Se generaron ${a.questions.length} preguntas de investigación.<br><br>${esc(a.summary).replace(/\n/g,'<br>')}</div>`;toast('Intervención guardada y preguntas añadidas a investigación.')}
function wireLiveText(){const ta=document.getElementById('liveText');if(ta){ta.addEventListener('input',()=>{S.drafts.liveText=ta.value;const wc=document.getElementById('wordCount');if(wc)wc.textContent=`${ta.value.trim()?ta.value.trim().split(/\s+/).length:0} palabras`;save()});const wc=document.getElementById('wordCount');if(wc)wc.textContent=`${ta.value.trim()?ta.value.trim().split(/\s+/).length:0} palabras`;}const search=document.getElementById('interventionSearch');if(search)search.addEventListener('input',()=>{const q=search.value.toLowerCase();const list=S.interventions.filter(i=>`${i.country} ${i.speaker} ${i.text}`.toLowerCase().includes(q));document.getElementById('liveInterventions').innerHTML=list.slice().reverse().slice(0,12).map(i=>`<div class="intervention"><div class="interventiontop"><b>${flagFor(i.country)} ${esc(i.country)} · ${esc(i.type)}</b><small>${esc(i.time)}</small></div><p>${esc(i.text)}</p><div class="chips">${(i.keywords||[]).map(k=>`<span class="chip">${esc(k)}</span>`).join('')}</div></div>`).join('')||'<div class="empty">Sin coincidencias.</div>'})}
function escapeRegex(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function highlight(text,q){let safe=esc(text);if(!q)return safe;const terms=q.trim().split(/\s+/).filter(x=>x.length>1).slice(0,8);terms.forEach(t=>{try{safe=safe.replace(new RegExp(`(${escapeRegex(esc(t))})`,'gi'),'<mark>$1</mark>')}catch(e){}});return safe}
function handbookMatches(q){const terms=q.toLowerCase().split(/\s+/).filter(Boolean);return (S.handbook.pages||[]).map((p,i)=>{const text=typeof p==='string'?p:p.text||'';const lower=text.toLowerCase();const score=terms.reduce((n,t)=>n+(lower.includes(t)?1:0),0);const first=Math.min(...terms.map(t=>{const at=lower.indexOf(t);return at<0?Infinity:at}));return {index:i+1,text,score,first}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score||a.first-b.first)}
function handbookResultsMarkup(q){const matches=handbookMatches(q);if(!matches.length)return '<div class=\"empty\"><b>No se encontraron coincidencias.</b>Prueba un sinónimo, una palabra más corta o confirma que el PDF tiene texto seleccionable. Los PDF escaneados necesitan OCR.</div>';const terms=q.toLowerCase().split(/\s+/).filter(Boolean);return `<div class=\"successnotice\" style=\"margin-bottom:10px\">${matches.length} páginas o fragmentos coinciden con “${esc(q)}”. Pulsa un resultado para abrir esa página en el visor.</div><div class=\"searchresults\">${matches.slice(0,80).map(m=>{const start=Math.max(0,(Number.isFinite(m.first)?m.first:0)-120);const snip=m.text.slice(start,start+370);return `<button class=\"searchresult\" data-action=\"handbook-page\" data-page=\"${m.index}\"><b><span>Página / fragmento ${m.index}</span><small>${m.score}/${terms.length} términos</small></b><p>${highlight(snip,q)}${snip.length>=370?'…':''}</p></button>`}).join('')}</div>`}
function searchHandbook(){const input=document.getElementById('handbookSearch');const q=(input?.value||'').trim();if(!q){toast('Escribe una palabra, frase o artículo para buscar.');return}if(!S.handbook.pages?.length){toast('Primero carga un handbook con texto.');return}S.drafts.lastSearchQuery=q;const matches=handbookMatches(q);S.drafts.lastHandbookSearchEvidence=matches.slice(0,8).map(m=>({fragment:m.index,excerpt:m.text.slice(Math.max(0,(Number.isFinite(m.first)?m.first:0)-160),Math.max(0,(Number.isFinite(m.first)?m.first:0)-160)+700)}));const out=document.getElementById('handbookResults');if(out)out.innerHTML=handbookResultsMarkup(q);save()}
async function loadHandbook(file){if(!file)return;toast('Leyendo documento e indexando texto…');try{let pages=[],text='',type=file.name.split('.').pop().toLowerCase(),pdfPageCount=0;if(type==='pdf'){if(!window.pdfjsLib){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js')}if(!window.pdfjsLib)throw new Error('No se pudo cargar PDF.js desde internet. Abre el PDF y pega el texto extraído, o vuelve a intentarlo con conexión.');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;pdfPageCount=pdf.numPages;for(let i=1;i<=pdf.numPages;i++){const page=await pdf.getPage(i);const tc=await page.getTextContent();pages.push(tc.items.map(x=>x.str).join(' '));if(i%10===0)toast(`Extrayendo página ${i} de ${pdf.numPages}…`)}text=pages.join('\n\n');const blobUrl=URL.createObjectURL(file);if(pdfBlobUrl)URL.revokeObjectURL(pdfBlobUrl);pdfBlobUrl=blobUrl;await idbPut('handbookPdf',file).catch(()=>{});S.viewer={url:blobUrl,title:file.name,page:1};}else if(type==='docx'){const arr=await file.arrayBuffer();if(!window.mammoth){await loadScript('https://cdn.jsdelivr.net/npm/mammoth@1.9.0/mammoth.browser.min.js')}if(!window.mammoth)throw new Error('No se pudo cargar el extractor DOCX. Prueba guardar el documento como TXT o PDF con texto.');const result=await mammoth.extractRawText({arrayBuffer:arr});text=result.value;pages=chunkText(text,4200);S.viewer={url:'',title:file.name,page:1};}else{text=await file.text();pages=chunkText(text,4200);S.viewer={url:'',title:file.name,page:1};}if(type==='pdf'&&(!text.trim()||text.replace(/\s/g,'').length<Math.max(100,pdfPageCount*25))){toast('PDF escaneado o con poco texto. Intentando OCR en las primeras páginas…');pages=await ocrPdfFile(file,60);text=pages.join('\n\n')}if(!text.trim())throw new Error('El archivo no contiene texto seleccionable. Si es un PDF escaneado, necesitas OCR antes de buscar.');const max=420000;text=text.slice(0,max);if(pages.length>0){let used=0;pages=pages.map(p=>{const left=max-used;const out=p.slice(0,Math.max(0,left));used+=out.length;return out}).filter(Boolean)}S.handbook={name:file.name,pages,text,type,uploadedAt:now()};save();render();toast(`Handbook indexado: ${pages.length} páginas / fragmentos.`)}catch(e){console.error(e);toast(e.message||'No se pudo extraer el documento.')} }
async function ocrPdfFile(file,maxPages=60){if(!window.pdfjsLib)throw new Error('PDF.js no disponible para OCR.');if(!window.Tesseract)await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');if(!window.Tesseract)throw new Error('No se pudo cargar el módulo OCR.');const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;const worker=await Tesseract.createWorker('spa+eng');const out=[];const count=Math.min(pdf.numPages,maxPages);for(let i=1;i<=count;i++){toast(`OCR de página ${i}/${count}…`);const page=await pdf.getPage(i);const viewport=page.getViewport({scale:1.4});const canvas=document.createElement('canvas');canvas.width=viewport.width;canvas.height=viewport.height;await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;const result=await worker.recognize(canvas);out.push(`[PÁGINA ${i}]\n${result.data.text||''}`);canvas.width=1;canvas.height=1}await worker.terminate();if(pdf.numPages>count)out.push(`Nota: OCR aplicado solo a las primeras ${count} de ${pdf.numPages} páginas. Vuelve a cargar por partes para indexar el resto.`);return out}
function chunkText(text,size){const out=[];for(let i=0;i<text.length;i+=size)out.push(text.slice(i,i+size));return out}
function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('No se pudo cargar el módulo de extracción.'));document.head.appendChild(s)})}
function idbPut(key,value){return new Promise((resolve,reject)=>{const req=indexedDB.open('munova-files',1);req.onupgradeneeded=()=>req.result.createObjectStore('files');req.onsuccess=()=>{const db=req.result;const tx=db.transaction('files','readwrite');tx.objectStore('files').put(value,key);tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error)};req.onerror=()=>reject(req.error)})}
function idbGet(key){return new Promise((resolve,reject)=>{const req=indexedDB.open('munova-files',1);req.onupgradeneeded=()=>req.result.createObjectStore('files');req.onsuccess=()=>{const tx=req.result.transaction('files','readonly');const get=tx.objectStore('files').get(key);get.onsuccess=()=>resolve(get.result||null);get.onerror=()=>reject(get.error)};req.onerror=()=>reject(req.error)})}
async function restorePdf(){try{if(S.viewer?.fileId){const blob=await idbGet('researchFile:'+S.viewer.fileId);if(blob){S.viewer.url=URL.createObjectURL(blob);return}}if(S.handbook.name&&S.handbook.type==='pdf'){const blob=await idbGet('handbookPdf');if(blob){pdfBlobUrl=URL.createObjectURL(blob);S.viewer={url:pdfBlobUrl,title:S.handbook.name,page:S.viewer.page||1};save()}}}catch(e){}}
async function loadResearchDocument(file,collection='research'){if(!file)return;const type=(file.name.split('.').pop()||'').toLowerCase();if(!['pdf','docx','txt','md','csv'].includes(type)){toast('Formato no compatible. Usa PDF, DOCX, TXT, MD o CSV.');return}const id=makeId();toast('Indexando documento y guardando el original…');try{await idbPut('researchFile:'+id,file);let pages=[],text='';if(type==='pdf'){if(!window.pdfjsLib)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');if(!window.pdfjsLib)throw new Error('PDF.js no disponible. Reintenta con conexión.');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();pages.push({page:i,text:tc.items.map(x=>x.str).join(' ')});if(i%15===0)toast(`Indexando página ${i} de ${pdf.numPages}…`)}text=pages.map(p=>`[PÁGINA ${p.page}]\n${p.text}`).join('\n\n');if(pages.reduce((n,p)=>n+(p.text||'').replace(/\s/g,'').length,0)<Math.max(30,pdf.numPages*18)){toast('Este PDF parece escaneado o tiene poco texto. Se guardó el original; usa Handbook para intentar OCR.')}}else if(type==='docx'){const arr=await file.arrayBuffer();if(!window.mammoth)await loadScript('https://cdn.jsdelivr.net/npm/mammoth@1.9.0/mammoth.browser.min.js');if(!window.mammoth)throw new Error('No se pudo cargar el extractor DOCX.');text=(await mammoth.extractRawText({arrayBuffer:arr})).value;pages=chunkText(text,4200).map((t,i)=>({page:i+1,text:t}))}else{text=await file.text();pages=chunkText(text,4200).map((t,i)=>({page:i+1,text:t}))}text=text.slice(0,900000);await idbPut('researchIndex:'+id,{text,pages:pages.slice(0,300),type,name:file.name,updatedAt:now()});S.researchFiles.push({id,name:file.name,type,size:file.size,addedAt:now(),chars:text.length,pages:pages.length,collection:collection||'research'});save();render();toast(`Documento guardado e indexado: ${file.name}.`)}catch(err){console.error(err);toast(err.message||'No se pudo guardar o indexar el documento.');}}
async function searchResearchDocs(){const q=(document.getElementById('researchDocQuery')?.value||'').trim();const target=document.getElementById('researchDocResults');if(!q){toast('Escribe una palabra o frase para buscar.');return}const searchableFiles=S.view==='research'?S.researchFiles.filter(f=>f.collection==='committee'):S.researchFiles;if(!searchableFiles.length){toast(S.view==='research'?'Añade primero documentos específicos del comité.':'Añade primero un documento de investigación.');return}if(target)target.innerHTML='<div class="notice">Buscando en los índices guardados…</div>';const terms=q.toLowerCase().split(/\s+/).filter(Boolean);const results=[];for(const f of searchableFiles){const idx=await idbGet('researchIndex:'+f.id).catch(()=>null);if(!idx)continue;for(const p of (idx.pages||[])){const txt=typeof p==='string'?p:p.text||'';const low=txt.toLowerCase();const score=terms.reduce((n,t)=>n+(low.includes(t)?1:0),0);if(score){const first=Math.min(...terms.map(t=>{const x=low.indexOf(t);return x<0?Infinity:x}));const at=Number.isFinite(first)?first:0;results.push({id:f.id,name:f.name,page:p.page||1,text:txt.slice(Math.max(0,at-100),Math.max(0,at-100)+430),score,first:at})}}}results.sort((a,b)=>b.score-a.score||a.first-b.first);S.drafts.lastDocumentEvidence=results.slice(0,10).map(r=>({document:r.name,page:r.page,excerpt:r.text,matchScore:r.score}));if(target)target.innerHTML=results.length?`<div class="successnotice">${results.length} coincidencias encontradas. Selecciona un resultado para abrir el archivo.</div><div class="searchresults">${results.slice(0,50).map(r=>`<button class="searchresult" data-action="open-research-result" data-id="${escAttr(r.id)}" data-page="${r.page}"><b><span>${esc(r.name)} · página / fragmento ${r.page}</span><small>${r.score}/${terms.length} términos</small></b><p>${highlight(r.text,q)}</p></button>`).join('')}</div>`:'<div class="empty"><b>Sin coincidencias.</b>Prueba con un sinónimo o verifica que el archivo tenga texto seleccionable.</div>';S.drafts.lastResearchDocQuery=q;save()}
async function openResearchFile(id,page=1){const f=S.researchFiles.find(x=>x.id===id);if(!f){toast('Archivo no encontrado.');return}const blob=await idbGet('researchFile:'+id).catch(()=>null);if(!blob){toast('El archivo original no está en este dispositivo. Vuelve a cargarlo desde el almacenamiento compartido.');return}const url=URL.createObjectURL(blob);S.viewer={url,title:f.name,page:Number(page)||1,fileId:id};save();render();toast('Documento abierto en el visor integrado.')}

function buildResolutionText(){const d=S.drafts;const pre=[`Recordando los propósitos y principios de la Carta de las Naciones Unidas,`,`Reconociendo la importancia de abordar ${d.resProblem||S.settings.agenda||'el problema definido en la agenda'} con medidas basadas en evidencia,`,d.resEvidence?`Tomando nota de la evidencia aportada por la delegación: ${d.resEvidence},`:'Tomando nota de la necesidad de verificar datos recientes en fuentes primarias,'];const ops=[];ops.push(`1. Alienta a ${d.resImplementer||'los actores competentes, dentro de sus respectivos mandatos'} a desarrollar un mecanismo coordinado para ${d.resMechanism||'atender el problema descrito mediante acciones verificables'}, con un plan de trabajo y responsabilidades claramente definidos;`);ops.push(`2. Recomienda que el mecanismo priorice a ${d.resBeneficiaries||'las poblaciones afectadas identificadas mediante evaluación documentada'}, garantizando participación significativa, accesibilidad y no discriminación;`);ops.push(`3. Invita a los actores pertinentes a identificar opciones de financiación transparentes y sostenibles, incluyendo ${d.resFunding||'fuentes voluntarias por determinar tras un análisis de viabilidad'}, sin crear obligaciones financieras no autorizadas;`);ops.push(`4. Solicita que la implementación contemple un plazo inicial de ${d.resDeadline||'12 meses'} y publique informes de avance periódicos;`);ops.push(`5. Recomienda medir el progreso mediante ${d.resIndicators||'indicadores con línea base, meta, periodicidad, desagregación pertinente y fuente de datos verificable'}, y ajustar las medidas según los resultados;`);ops.push(`6. Exhorta a incorporar salvaguardas relativas a ${d.resSafeguards||'derechos humanos, privacidad, participación de comunidades afectadas y rendición de cuentas'}, con canales accesibles para presentar observaciones;`);ops.push(`7. Pide que las fuentes, supuestos, limitaciones y gastos relacionados con la propuesta se documenten de manera transparente y se revisen de acuerdo con el mandato del órgano;`);return `PROYECTO DE RESOLUCIÓN — BORRADOR PARA REVISIÓN\nComité: ${S.settings.committee}\nSesión: ${S.settings.session}\nTema: ${d.resTitle||S.settings.agenda}\nDelegación impulsora: ${S.settings.activeCountry}\n\nCLÁUSULAS PREAMBULATORIAS\n${pre.map(p=>p).join('\n')}\n\nCLÁUSULAS OPERATIVAS\n${ops.join('\n')}\n\nEVIDENCIA Y VALIDACIÓN PENDIENTE\n${d.resEvidence||'No se aportó evidencia verificable: investigar antes de presentar.'}\n\nNOTA DE CONTROL\nEste borrador no afirma que existan datos verificados ni competencias jurídicas específicas. Verificar cada dato, fuente, mandato, presupuesto y regla de procedimiento en el handbook y en documentos oficiales.`}
function buildSpeech(){const d=S.drafts;const country=S.settings.activeCountry;return `Honorable mesa, distinguidas delegaciones:\n\nLa delegación de ${country} considera que ${d.speechPosition||'este comité debe abordar la agenda con una respuesta viable, coordinada y basada en evidencia'}.\n\nEn cuanto a la evidencia, ${d.speechEvidence||'proponemos que cualquier afirmación cuantitativa o jurídica se respalde con una fuente primaria, fecha y metodología verificables'}.\n\nPor ello, proponemos ${d.speechMechanism||'definir responsables, financiación realista, indicadores de resultado y un calendario de seguimiento'}.\n\nInvitamos a las delegaciones a trabajar sobre una fórmula de consenso que preserve el mandato del comité y permita evaluar resultados. ${d.speechAsk||'¿Qué mecanismo verificable permitiría medir el cumplimiento de los compromisos?'}\n\nMuchas gracias.`}
async function callAI(action,context){if(aiBusy)return null;const code=S.settings.accessCode||'';if(!code){toast('Para activar Gemini, configura GEMINI_API_KEY y MUNOVA_ACCESS_CODE en Vercel; luego guarda el código de acceso en Ajustes.');return null}if(location.protocol==='file:'){toast('La IA conectada requiere abrir MUNOVA desde Vercel o localhost con /api/mun-ai.');return null}aiBusy=true;const targets=['strategyResult','resolutionResult','handbookSummary','speechResult','liveAIResult','docAIStatus'];targets.forEach(id=>{const el=document.getElementById(id);if(el)el.innerHTML='<span class="loading"><span class="spinner"></span>Gemini está analizando el contexto…</span>'});try{const res=await fetch('/api/mun-ai',{method:'POST',headers:{'Content-Type':'application/json','x-munova-access-code':code},body:JSON.stringify({action,context})});const data=await res.json();if(!res.ok)throw new Error(data.error||'Error del asistente Gemini');const out=data.result||'No se recibió respuesta.';const target=action==='strategy'?'strategyResult':action==='resolution'?'resolutionResult':action==='speech'?'speechResult':action==='analyze'?'liveAIResult':action==='document'?'docAIStatus':'handbookSummary';const el=document.getElementById(target);if(el)el.innerHTML=markdownToHtml(out);S.drafts['lastAI_'+action]=out;if(action==='resolution')S.drafts.lastResolution=out;if(action==='speech')S.drafts.lastSpeech=out;save();return out}catch(e){toast(e.message||'No se pudo conectar con Gemini.');return null}finally{aiBusy=false}}
function markdownToHtml(text){let safe=esc(text);safe=safe.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noreferrer">$1 ↗</a>');safe=safe.replace(/(?<!href=")https?:\/\/[^\s<]+/g,url=>`<a href="${url}" target="_blank" rel="noreferrer">${url} ↗</a>`);safe=safe.replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h3>$1</h3>').replace(/^\*\*([^*]+)\*\*$/gm,'<b>$1</b>').replace(/^[-•] (.*)$/gm,'• $1').replace(/\n/g,'<br>');return safe}

function runLocalStrategy(){const country=S.settings.activeCountry,posture=S.delegations.find(d=>d.country===country)?.position||'Postura pendiente de documentar';const pending=S.research.filter(r=>r.status!=='Resuelta');const allies=S.delegations.filter(d=>d.country!==country&&d.position&&d.position!=='Pendiente de investigación.');const text=`ESTRATEGIA PRELIMINAR · ${country}\n\n1. TESIS: formular una posición en una frase y vincularla con el mandato del comité.\nPostura registrada: ${posture}\n\n2. OBJETIVOS DE NEGOCIACIÓN\n• Objetivo mínimo: asegurar una medida operativa con responsable y seguimiento.\n• Objetivo ideal: incluir línea base, meta, calendario, financiación y rendición de cuentas.\n• Línea roja declarada: ${S.drafts.strategyRedLine||'definir antes de negociar'}.\n• Concesión posible: ${S.drafts.strategyConcession||'negociar el diseño sin abandonar los principios esenciales'}.\n\n3. ACTORES QUE REQUIEREN CONTRASTE\n${allies.map(d=>`• ${d.country}: ${d.position} (registrado en la app; verificar fuente).`).join('\n')||'• No hay posturas suficientes para proponer coaliciones con fundamento.'}\n\n4. PREGUNTAS TÁCTICAS\n${pending.slice(0,5).map((r,i)=>`${i+1}. ${r.question}`).join('\n')||'• ¿Qué fuente primaria y qué indicador permitirían comprobar la afirmación principal?'}\n\n5. SIGUIENTE PASO\nBuscar documentos oficiales y registrar URLs; no asumir que países con prioridades parecidas votarán igual. Este análisis es local y no consulta la web.`;document.getElementById('strategyResult').innerHTML=markdownToHtml(text);S.drafts.lastStrategyLocal=text;save()}
function renderHandbookSummary(){const text=S.handbook.text;if(!text){toast('Primero carga un handbook con texto.');return}const terms=keywords(text);const sentences=text.replace(/\s+/g,' ').split(/(?<=[.!?])\s+/).filter(x=>x.length>65);const ranked=sentences.map((sentence,index)=>{const lower=sentence.toLowerCase();const keyScore=terms.reduce((n,t)=>n+(lower.includes(t)?1:0),0);const normScore=/(art[ií]culo|regla|procedimiento|moci[oó]n|qu[oó]rum|votaci[oó]n|delegad|presidencia|mandato|competencia|deber[aá]|shall|must|may|resolution|resoluci[oó]n|tratado|plazo|financiaci[oó]n|indicador|anexo|anexo|prohib|permit|sanci[oó]n)/i.test(sentence)?3:0;const numberScore=/(\d{1,4}|%|p[aá]gina|art\.?\s*\d)/i.test(sentence)?1.5:0;const page=(S.handbook.pages||[]).findIndex(p=>p.includes(sentence.slice(0,Math.min(70,sentence.length))));return {sentence,index,score:keyScore+normScore+numberScore+(index<15?.2:0),page:page>=0?page+1:null}}).sort((a,b)=>b.score-a.score).slice(0,12);const out=`PUNTOS CLAVE EXTRAÍDOS DE ${S.handbook.name}\n\nTérminos detectados: ${terms.join(', ')}\n\nFRAGMENTOS QUE MERECEN REVISIÓN\n${ranked.map((x,i)=>`${i+1}. ${x.page?`[Página ${x.page}] `:''}${x.sentence}`).join('\n\n')}\n\nCONTROL DE CALIDAD\nEste resumen automático prioriza lenguaje normativo, procedimientos, plazos, cifras y términos repetidos. Lee el párrafo completo en el documento y verifica cualquier número, regla o competencia antes de aplicarla.`;document.getElementById('handbookSummary').innerHTML=`<div class="resultbox" style="margin-top:12px">${esc(out).replace(/\n/g,'<br>')}</div>`;S.drafts.handbookSummary=out;save()}

function startMic(){const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Speech){toast('Este navegador no ofrece dictado de voz. Prueba Chrome o Edge en HTTPS.');return}if(micActive){micRecognition?.stop();micActive=false;const b=document.getElementById('micButton');if(b)b.classList.remove('recording');return}micRecognition=new Speech();micRecognition.lang=S.settings.language==='English'?'en-US':S.settings.language==='Français'?'fr-FR':'es-CO';micRecognition.continuous=true;micRecognition.interimResults=true;let finalText='';micRecognition.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const tr=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=tr+' ';else interim+=tr}const ta=document.getElementById('liveText');if(ta){ta.value=(S.drafts.liveText||'')+finalText+interim;const wc=document.getElementById('wordCount');if(wc)wc.textContent=`${ta.value.trim()?ta.value.trim().split(/\s+/).length:0} palabras`}};micRecognition.onerror=e=>toast('Micrófono: '+(e.error||'error de reconocimiento'));micRecognition.onend=()=>{micActive=false;document.getElementById('micButton')?.classList.remove('recording');const ta=document.getElementById('liveText');if(ta){S.drafts.liveText=ta.value;save()}};micActive=true;document.getElementById('micButton')?.classList.add('recording');micRecognition.start();toast('Micrófono activo. Pulsa de nuevo para detener.')}

GOS Y SALVAGUARDAS\n[Mitigaciones, protección de datos y rendición de cuentas.]\n\nFUENTES\n[Referencias verificables.]`]};const t=templates[type]||templates.position;S.drafts.docTitle=t[0];S.drafts.docBody=t[1];save();render();toast('Estructura insertada. Completa los campos y actualiza la vista previa.')}else if(a==='ai-document'){const type=document.querySelector('[data-bind="drafts.docType"]')?.value||S.drafts.docType;const title=document.querySelector('[data-bind="drafts.docTitle"]')?.value||S.drafts.docTitle;const body=document.querySelector('[data-bind="drafts.docBody"]')?.value||S.drafts.docBody;const out=await callAI('document',aiContext({documentType:type,documentTitle:title,draftBody:body,task:'Redacta un documento listo para presentar, con tono formal y contenido sustantivo. Investiga hechos actuales y añade fuentes enlazadas. Mantén Times New Roman en el formato de exportación; el cuerpo debe ser contenido, no instrucciones de diseño.'}));if(out){S.drafts.docBody=out;S.drafts.lastAI_document=out;save();render();toast('Borrador creado con IA. Revisa citas, normas y datos antes de presentarlo.')}}else if(a==='generate-doc-preview'){generateDocPreview()}else if(a==='download-doc'){const title=document.querySelector('[data-bind="drafts.docTitle"]')?.value||S.drafts.docTitle;const body=document.querySelector('[data-bind="drafts.docBody"]')?.value||S.drafts.docBody;S.drafts.docTitle=title;S.drafts.docBody=body;saveDoc();downloadWord(title,body,(title||'MUNOVA').replace(/[^a-z0-9áéíóúñ-]+/gi,'-')+'.doc');toast('Documento Word-compatible descargado y archivado.')}else if(a==='print-doc'){const title=document.querySelector('[data-bind="drafts.docTitle"]')?.value||S.drafts.docTitle;const body=document.querySelector('[data-bind="drafts.docBody"]')?.value||S.drafts.docBody;printDoc(title,body)}else if(a==='load-doc'){loadDoc(id)}else if(a==='download-saved-doc'){const d=S.documents.find(x=>x.id===id);if(d)downloadWord(d.title,d.body,d.title.replace(/[^a-z0-9áéíóúñ-]+/gi,'-')+'.doc')}else if(a==='delete-doc'){S.documents=S.documents.filter(d=>d.id!==id);save();render()}else if(a==='test-ai'){const code=S.settings.accessCode||'';const status=document.getElementById('aiTestStatus');if(!code){if(status)status.textContent='Escribe primero el código que configuraste como MUNOVA_ACCESS_CODE en Vercel.';toast('Falta el código de acceso para IA.');return}if(location.protocol==='file:'){if(status)status.textContent='La vista previa local no tiene el endpoint /api/mun-ai. Publica en Vercel o usa vercel dev para probar Gemini.';toast('Prueba Gemini desde Vercel o vercel dev.');return}if(status)status.textContent='Probando conexión con Gemini…';try{const response=await fetch('/api/mun-ai',{method:'POST',headers:{'Content-Type':'application/json','x-munova-access-code':code},body:JSON.stringify({action:'speech',context:{task:'Prueba técnica de conexión. Responde brevemente en español confirmando que MUNOVA puede comunicarse con Gemini.',committee:S.settings.committee}})});const payload=await response.json();if(!response.ok)throw new Error(payload.error||'No se pudo conectar con Gemini.');if(status)status.textContent='Conexión correcta · '+(payload.model||'Gemini')+' · '+String(payload.result||'Respuesta recibida').slice(0,220);toast('Gemini respondió correctamente.')}catch(err){if(status)status.textContent='No conectado: '+(err.message||'error desconocido');toast(err.message||'No se pudo probar Gemini.')}}else if(a==='save-settings'){save();toast('Ajustes guardados.')}else if(a==='export-data'){exportData()}else if(a==='import-data'){const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=()=>importData(inp.files[0]);inp.click()}else if(a==='clear-workspace'){if(confirm('Esto borrará delegaciones, intervenciones, documentos y preguntas guardadas en este navegador. ¿Continuar?')){localStorage.removeItem(STORAGE);S=defaultState();save();render();toast('Workspace restablecido.')}}else if(a==='close-modal'){document.getElementById('evidenceModal')?.remove()}else if(a==='index-pasted-handbook'){const txt=document.getElementById('manualHandbookText')?.value||'';if(!txt.trim()){toast('Pega primero el texto del handbook.');return}S.handbook={name:S.handbook.name||'Texto pegado del handbook',type:'text',text:txt,pages:chunkText(txt,4200),uploadedAt:now()};S.viewer={url:'',title:S.handbook.name,page:1};S.drafts.lastSearchQuery='';save();render();toast(`Texto indexado: ${S.handbook.pages.length} fragmentos.`)}else if(a==='handbook-summary'){renderHandbookSummary()}
}catch(err){console.error(err);toast('No se pudo completar la acción: '+(err.message||'error inesperado'))}});
function downloadBlob(text,filename,mime){const blob=new Blob([text],{type:mime||'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target?.id==='globalSearch'){e.preventDefault();document.querySelector('[data-action="global-search"]')?.click()}if(e.key==='Enter'&&e.target?.id==='quickCountryInput'){e.preventDefault();document.querySelector('[data-action="quick-add-country-input"]')?.click()}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('globalSearch')?.focus()}});

function munovaAllEntities(){
 const out=[]; const add=(name,type,icon)=>{if(name&&!out.some(x=>x.name.toLowerCase()===name.toLowerCase()))out.push({name,type,icon:icon||'◈'});};
 (countries||[]).forEach(c=>add(c[0],'Estado / país',c[1]));
 (S.delegations||[]).forEach(d=>add(d.country,d.entityType||'Delegación',d.flag||flagFor(d.country)));
 (actorPresets||[]).forEach(a=>add(a.name,a.type,a.icon));
 (S.actors||[]).forEach(a=>add(a.name,a.type,a.icon));
 return out.sort((a,b)=>a.name.localeCompare(b.name,'es'));
}
function munovaEntityOptions(selected){return munovaAllEntities().map(e=>`<option value="${escAttr(e.name)}" ${e.name===selected?'selected':''}>${esc(e.icon)} ${esc(e.name)} · ${esc(e.type)}</option>`).join('')}
function munovaDatalist(id){return `<datalist id="${id}">${munovaAllEntities().map(e=>`<option value="${escAttr(e.name)}" label="${escAttr(e.type)}"></option>`).join('')}</datalist>`}

 __munovaOriginalUpdateBind(el);
 if(path==='settings.sessionLength'){
   S.settings.sessionLength=Number(S.settings.sessionLength)||90;

timerToggle = function(){
 if(timerInt){clearInterval(timerInt);timerInt=null;save();toast('Cronómetro pausado.');return;}
 if(Number(S.timerSeconds)<=0){toast('Reinicia el cronómetro antes de comenzar.');return;}
 S.timerHasStarted=true;
 timerInt=setInterval(()=>{
   S.timerSeconds=Math.max(0,(Number(S.timerSeconds)||0)-1);
   S.timerElapsedSeconds=(Number(S.timerElapsedSeconds)||0)+1;
   const el=document.getElementById('timer');if(el)el.textContent=fmtTime(S.timerSeconds);
   const label=document.getElementById('timerElapsedLabel');if(label)label.textContent='Transcurrido: '+fmtTime(S.timerElapsedSeconds);
   if(S.timerSeconds===0){clearInterval(timerInt);timerInt=null;save();toast('Tiempo agotado.');}
   else if(S.timerElapsedSeconds%5===0)save();
 },1000);toast('Cronómetro iniciado.');
};

 window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.__munovaInstallPrompt=e;});
 if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'))navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
})();
const __munovaBaseSettings=renderSettings;
renderSettings=function(){return __munovaBaseSettings().replace('<p class="footnote">No pegues aquí la clave de Gemini.','<div class="actionrow" style="margin:10px 0;flex-wrap:wrap"><button class="btn primary" data-action="test-ai">Probar conexión con Gemini</button><a class="btn" href="https://aistudio.google.com/apikey" target="_blank" rel="noreferrer">Abrir Google AI Studio ↗</a></div><div id="aiTestStatus" class="notice" style="margin-bottom:12px">Después de publicar en Vercel y guardar el código de acceso, prueba aquí la conexión. La clave API nunca va en esta página.</div><p class="footnote">No pegues aquí la clave de Gemini.');};
const __munovaBaseRender=render;

function mountMunovaExtras(){
 const app=document.getElementById('app');if(!app)return;
 let dock=app.querySelector('.mobile-dock');if(!dock){dock=document.createElement('nav');dock.className='mobile-dock';dock.setAttribute('aria-label','Navegación rápida');dock.innerHTML=`<button data-action="navigate" data-view="dashboard" class="${S.view==='dashboard'?'active':''}"><span>⌂</span>Inicio</button><button data-action="navigate" data-view="live" class="${S.view==='live'?'active':''}"><span>◉</span>Mesa</button><button data-action="navigate" data-view="strategy" class="${S.view==='strategy'?'active':''}"><span>◎</span>Estrategia</button><button data-action="navigate" data-view="resolution" class="${S.view==='resolution'?'active':''}"><span>✦</span>Resolver</button>`;app.appendChild(dock);}else{dock.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x.dataset.view===S.view));}
 const top=document.querySelector('.topright');if(top&&!top.querySelector('#munovaInstallBtn')){const btn=document.createElement('button');btn.id='munovaInstallBtn';btn.className='btn small pwa-install';btn.textContent='＋ Instalar';btn.dataset.mxAction='install-app';btn.title='Instalar MUNOVA como app en este dispositivo';top.insertBefore(btn,top.firstChild);}
